<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px/1.4 system-ui, sans-serif; width: 290px; margin: 10px; }
      input, button, select { box-sizing: border-box; width: 100%; margin: 4px 0; padding: 6px 8px; }
      .row { display: flex; gap: 6px; }
      .row button { flex: 1; }
      #keyState {
        display: flex; justify-content: space-between; align-items: center;
        background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534;
        padding: 6px 8px; border-radius: 6px; margin: 6px 0; font-size: 12px;
      }
      #changeKey {
        background: none; border: none; color: #166534; text-decoration: underline;
        cursor: pointer; width: auto; margin: 0; padding: 0; font-size: 12px;
      }
      #status { margin-top: 6px; min-height: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <input id="goal" type="text" placeholder="What do you want to do?" />

    <select id="provider">
      <option value="offline">No model (works with no internet)</option>
      <option value="ollama">Local model (free, offline)</option>
      <option value="custom">My gateway (OpenAI-compatible)</option>
      <option value="gemini">Gemini API</option>
      <option value="anthropic">Anthropic API</option>
    </select>

    <div id="customBox" hidden>
      <input id="baseUrl" type="text" placeholder="Base URL, e.g. http://localhost:8000/v1" />
      <input id="modelName" type="text" placeholder="Models, comma-separated (fastest wins)" />
    </div>

    <div id="keyState" hidden>
      <span>&#10003; API key saved</span>
      <button id="changeKey" type="button">change</button>
    </div>

    <div id="keyBox">
      <input id="apiKey" type="password" placeholder="Paste API key (saves itself)" />
    </div>

    <div class="row">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="stop" type="button">Stop</button>
    </div>

    <button id="testdot" type="button">Test dot (no AI)</button>
    <div id="status"></div>
    <script src="config.local.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
